<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Search UNESCO World Heritage Sites by keyword, language, or location.">
  <meta name="theme-color" content="#0056b3">
  <title>{% block title %}Heritage Atlas — UNESCO World Heritage Sites{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/leaflet/leaflet.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script defer src="{{ url_for('static', filename='vendor/leaflet/leaflet.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/explorer.js') }}"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header>
    <h1><a href="{{ url_for('search') }}">Heritage Atlas</a></h1>
    <p>UNESCO World Heritage Sites</p>
  </header>
  <main id="main">{% block content %}{% endblock %}</main>
  <footer>
    <p>Historical data through 2021. An independent project, not affiliated with UNESCO.</p>
    <a href="https://github.com/muzammilkhan2784/UNESCO-World-Heritage-Explorer">Project on GitHub</a>
    <span aria-hidden="true"> · </span>
    <a href="https://whc.unesco.org/en/list/">Official UNESCO list</a>
  </footer>
</body>
</html>
